<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Clock</title>
<meta name="description" content="Analog + digital countdown timer for trainers and facilitators, with color-coded remaining time, presets, sound cues, and dark/light themes.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<meta name="theme-color" content="#0f1420" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Clock">

<style>
  :root{
    --bg-1:#0f1420;
    --bg-2:#161d2e;
    --panel:#1b2436;
    --panel-2:#212c42;
    --border:#2c3a56;
    --text:#eaf0ff;
    --text-dim:#8ea0c2;
    --accent:#5b8cff;
    --accent-2:#7ee0c3;
    --green:#3ddc84;
    --amber:#ffb84d;
    --red:#ff5470;
    --track:#28324a;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
    --grad-1:#223055;
    --grad-2:#1c2947;
    --tick-minor: rgba(234,240,255,.18);
    --tick-major: rgba(234,240,255,.4);
    --digital-shadow: rgba(0,0,0,.4);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }

  :root[data-theme="light"]{
    --bg-1:#eef1f8;
    --bg-2:#e2e8f6;
    --panel:#ffffff;
    --panel-2:#f2f5fb;
    --border:#dbe2f0;
    --text:#1a2133;
    --text-dim:#5b6580;
    --accent:#3f6de0;
    --accent-2:#0e9c7a;
    --green:#1fae63;
    --amber:#c97c0a;
    --red:#d92d4e;
    --track:#e3e8f3;
    --shadow: 0 20px 50px rgba(30,40,70,.14);
    --grad-1:#cfdaf6;
    --grad-2:#e7ecf9;
    --tick-minor: rgba(26,33,51,.18);
    --tick-major: rgba(26,33,51,.4);
    --digital-shadow: rgba(30,40,70,.15);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(1200px 800px at 15% -10%, var(--grad-1) 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, var(--grad-2) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
      max(28px, var(--safe-t))
      max(16px, var(--safe-r))
      max(40px, var(--safe-b))
      max(16px, var(--safe-l));
    transition: background-color .4s ease, color .3s ease;
    overscroll-behavior:none;
    user-select:none;
  }
  input, textarea{ user-select:text; }

  body.flash{
    animation: flashBg 1s ease-in-out infinite;
  }
  @keyframes flashBg{
    0%,100%{ background-color: rgba(255,84,112,0); }
    50%{ background-color: rgba(255,84,112,0.18); }
  }

  .app{
    width:100%;
    max-width:960px;
    display:grid;
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "clock"
      "panel"
      "footer";
    align-items:center;
    justify-items:center;
    gap:20px;
    flex:1;
  }

  header{
    grid-area:header;
    width:100%;
    text-align:center;
    padding-top:6px;
  }
  header h1{
    margin:0 0 4px;
    font-size:15px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .session-input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:clamp(20px, 4vw, 34px);
    font-weight:700;
    text-align:center;
    width:100%;
    max-width:640px;
    padding:4px 8px;
    border-bottom:2px solid transparent;
    transition:border-color .2s ease;
  }
  .session-input:hover, .session-input:focus{
    border-bottom-color:var(--border);
  }
  .session-input::placeholder{
    color:var(--text-dim);
    font-weight:600;
  }

  /* ===== Clock ===== */
  .clock-wrap{
    grid-area:clock;
    position:relative;
    width:min(78vw, 420px);
    aspect-ratio:1/1;
    border-radius:50%;
    background: var(--panel);
    box-shadow: var(--shadow), inset 0 0 0 1px var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .dial{
    position:relative;
    width:88%;
    height:88%;
    border-radius:50%;
    background: conic-gradient(var(--wedge-color, var(--green)) calc(var(--pct,100) * 1%), var(--track) 0);
    transition: background 0.25s linear;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.03);
  }

  .dial-inner{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 35%, var(--panel-2), var(--panel) 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    box-shadow: inset 0 0 0 1px var(--border), 0 6px 18px rgba(0,0,0,.35);
  }

  .ticks{
    position:absolute;
    inset:0;
  }
  .tick{
    position:absolute;
    top:50%; left:50%;
    width:2px;
    height:6px;
    background:var(--tick-minor);
    transform-origin:1px 50%;
  }
  .tick.major{
    width:3px;
    height:12px;
    background:var(--tick-major);
  }

  .digital{
    font-variant-numeric: tabular-nums;
    font-size:clamp(34px, 8vw, 58px);
    font-weight:800;
    letter-spacing:.02em;
    color:var(--text);
    text-shadow:0 2px 12px var(--digital-shadow);
  }
  .digital.warn{ color: var(--amber); }
  .digital.danger{ color: var(--red); }

  .sub-label{
    margin-top:4px;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
  }

  /* ===== Controls ===== */
  .panel{
    grid-area:panel;
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px 20px;
    box-shadow: var(--shadow);
  }

  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:16px;
  }
  .preset-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .preset-btn:hover{ background:#26314a; border-color:var(--accent); }
  .preset-btn:active{ transform:scale(.96); }
  .preset-btn.active{
    background: linear-gradient(135deg, var(--accent), #3f6de0);
    border-color:transparent;
    color:#fff;
  }

  .custom-time{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .custom-time input[type=number]{
    width:64px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-size:16px;
    font-weight:700;
    text-align:center;
    padding:8px 6px;
    border-radius:10px;
    outline:none;
  }
  .custom-time input[type=number]:focus{ border-color:var(--accent); }
  .custom-time label{
    font-size:12px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-right:2px;
  }
  .custom-time .set-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 16px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
  }
  .custom-time .set-btn:hover{ border-color:var(--accent-2); }

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .btn{
    border:none;
    border-radius:14px;
    padding:14px 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .12s ease, filter .15s ease, box-shadow .15s ease;
    color:#fff;
  }
  .btn:active{ transform:scale(.95); }
  .btn.primary{
    background:linear-gradient(135deg, var(--green), #1fae63);
    box-shadow:0 8px 20px rgba(61,220,132,.25);
  }
  .btn.primary.pause{
    background:linear-gradient(135deg, var(--amber), #e08e1a);
    box-shadow:0 8px 20px rgba(255,184,77,.25);
  }
  .btn.secondary{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn.secondary:hover{ border-color:var(--accent); }
  .btn.danger{
    background:linear-gradient(135deg, var(--red), #d43a58);
    box-shadow:0 8px 20px rgba(255,84,112,.25);
  }
  .btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    filter:grayscale(.4);
  }

  .adjust-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .chip{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .chip:hover{ border-color:var(--accent-2); }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .icon-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    width:42px; height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    transition:border-color .15s ease, background .15s ease;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .icon-btn.off{ opacity:.45; }
  .icon-btn.pip-active{ border-color:var(--green); color:var(--green); }

  footer{
    grid-area:footer;
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
  }
  kbd{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
    font-size:11px;
  }

  @media (max-width: 520px){
    .transport{ gap:8px; }
    .btn{ padding:12px 16px; font-size:14px; }
  }

  /* ===== Widescreen / tablet landscape: dial + controls side by side ===== */
  @media (orientation:landscape) and (min-width:680px){
    body{
      padding:
        max(14px, var(--safe-t))
        max(20px, var(--safe-r))
        max(14px, var(--safe-b))
        max(20px, var(--safe-l));
      justify-content:center;
    }
    .app{
      max-width:1180px;
      height:100%;
      max-height:100%;
      grid-template-columns: minmax(260px,440px) minmax(300px,1fr);
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "clock  panel"
        "footer footer";
      gap:10px 32px;
      align-items:center;
    }
    header{ padding-top:0; }
    .clock-wrap{
      width:min(48vh, 38vw, 420px);
      justify-self:end;
    }
    .panel{
      justify-self:start;
      max-width:460px;
      align-self:center;
    }
  }

  /* Short landscape (phones in landscape): trim vertical footprint further */
  @media (orientation:landscape) and (min-width:680px) and (max-height:480px){
    .app{ grid-template-columns: minmax(150px,220px) minmax(300px,1fr); gap:6px 20px; }
    header h1{ display:none; }
    .session-input{ font-size:15px; padding:2px 6px; }
    .clock-wrap{ width:min(60vh, 24vw, 190px); }
    .panel{ padding:8px 14px; }
    .presets{ margin-bottom:6px; gap:6px; }
    .preset-btn{ padding:6px 10px; font-size:12px; }
    .custom-time{ margin-bottom:6px; }
    .custom-time input[type=number]{ padding:6px 4px; font-size:13px; width:50px; }
    .custom-time .set-btn{ padding:6px 12px; font-size:13px; }
    .transport{ margin-bottom:6px; gap:8px; }
    .btn{ padding:8px 12px; font-size:12px; }
    .adjust-row{ margin-bottom:6px; gap:6px; }
    .chip{ padding:5px 10px; font-size:12px; }
    .toolbar{ padding-top:6px; }
    .icon-btn{ width:32px; height:32px; font-size:14px; }
    footer{ display:none; }
  }

  /* Fullscreen focus mode: always just center the dial, ignore grid areas */
  body.fs-mode .app{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  body.fs-mode header,
  body.fs-mode .panel,
  body.fs-mode footer{ display:none; }
  body.fs-mode .clock-wrap{ width:min(70vw, 70vh, 560px); }

  /* Always-reachable way out of focus mode — the toolbar (and its fullscreen
     button) is hidden above, and iPhone has no Fullscreen API / Esc key. */
  .exit-focus-btn{
    display:none;
    position:fixed;
    top:max(14px, var(--safe-t));
    right:max(14px, var(--safe-r));
    z-index:50;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:18px;
    align-items:center;
    justify-content:center;
    opacity:.55;
    cursor:pointer;
  }
  .exit-focus-btn:hover, .exit-focus-btn:active{ opacity:1; }
  body.fs-mode .exit-focus-btn{ display:flex; }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Training Clock</h1>
    <input class="session-input" id="sessionTitle" placeholder="Session name (e.g. Group Exercise, Coffee Break)" maxlength="60">
  </header>

  <div class="clock-wrap" id="clockWrap">
    <div class="dial" id="dial">
      <div class="ticks" id="ticks"></div>
      <div class="dial-inner">
        <div class="digital" id="digital">05:00</div>
        <div class="sub-label" id="subLabel">Ready</div>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <div class="presets" id="presets">
      <button class="preset-btn" data-min="1">1m</button>
      <button class="preset-btn" data-min="3">3m</button>
      <button class="preset-btn" data-min="5">5m</button>
      <button class="preset-btn active" data-min="10">10m</button>
      <button class="preset-btn" data-min="15">15m</button>
      <button class="preset-btn" data-min="20">20m</button>
      <button class="preset-btn" data-min="30">30m</button>
      <button class="preset-btn" data-min="45">45m</button>
      <button class="preset-btn" data-min="60">60m</button>
    </div>

    <div class="custom-time">
      <label>MM</label>
      <input type="number" id="customMin" min="0" max="180" value="10" inputmode="numeric">
      <label>SS</label>
      <input type="number" id="customSec" min="0" max="59" value="0" inputmode="numeric">
      <button class="set-btn" id="setCustom">Set</button>
    </div>

    <div class="transport">
      <button class="btn primary" id="startPauseBtn">▶ Start</button>
      <button class="btn secondary" id="resetBtn">⟲ Reset</button>
      <button class="btn danger" id="stopBtn">■ Stop</button>
    </div>

    <div class="adjust-row">
      <button class="chip" data-adj="-300">−5 min</button>
      <button class="chip" data-adj="-60">−1 min</button>
      <button class="chip" data-adj="60">+1 min</button>
      <button class="chip" data-adj="300">+5 min</button>
    </div>

    <div class="toolbar">
      <button class="icon-btn" id="soundBtn" title="Toggle sound">🔊</button>
      <button class="icon-btn" id="fsBtn" title="Fullscreen focus mode">⛶</button>
      <button class="icon-btn" id="wakeBtn" title="Keep screen awake">💡</button>
      <button class="icon-btn" id="themeBtn" title="Toggle dark / light theme">🌙</button>
      <button class="icon-btn" id="pipBtn" title="Pop out floating timer">📌</button>
    </div>
  </div>

  <footer>
    <span><kbd>Space</kbd> start/pause &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>T</kbd> theme &nbsp; <kbd>P</kbd> pop out</span>
  </footer>

</div>

<button class="exit-focus-btn" id="exitFocusBtn" title="Exit focus mode">✕</button>

<canvas id="pipCanvas" width="360" height="360" style="position:fixed; left:-9999px; top:-9999px;"></canvas>
<video id="pipVideo" muted playsinline style="display:none"></video>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  let totalSeconds = 10*60;      // duration set for this timer
  let remaining = totalSeconds;  // seconds left
  let running = false;
  let tickHandle = null;
  let lastTick = null;
  let soundOn = true;
  let wakeLock = null;

  // ---------- DOM ----------
  const digitalEl = document.getElementById('digital');
  const subLabelEl = document.getElementById('subLabel');
  const dialEl = document.getElementById('dial');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stopBtn = document.getElementById('stopBtn');
  const presetsEl = document.getElementById('presets');
  const customMin = document.getElementById('customMin');
  const customSec = document.getElementById('customSec');
  const setCustomBtn = document.getElementById('setCustom');
  const soundBtn = document.getElementById('soundBtn');
  const fsBtn = document.getElementById('fsBtn');
  const exitFocusBtn = document.getElementById('exitFocusBtn');
  const wakeBtn = document.getElementById('wakeBtn');
  const themeBtn = document.getElementById('themeBtn');
  const pipBtn = document.getElementById('pipBtn');
  const pipCanvas = document.getElementById('pipCanvas');
  const pipVideo = document.getElementById('pipVideo');
  const ticksEl = document.getElementById('ticks');
  const sessionTitle = document.getElementById('sessionTitle');
  const themeColorMeta = document.getElementById('themeColorMeta');

  // ---------- Theme (dark / light) ----------
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
    themeBtn.title = theme === 'dark' ? 'Dark theme (click for light)' : 'Light theme (click for dark)';
    if(themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#0f1420' : '#eef1f8');
    try{ localStorage.setItem('trainingClockTheme', theme); }catch(e){}
  }
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('trainingClockTheme'); }catch(e){}
    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(saved || (prefersLight ? 'light' : 'dark'));
  })();
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // ---------- Build tick marks (60 around the dial) ----------
  (function buildTicks(){
    const frag = document.createDocumentFragment();
    for(let i=0;i<60;i++){
      const t = document.createElement('div');
      t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
      frag.appendChild(t);
    }
    ticksEl.appendChild(frag);
    positionTicks();
  })();

  function positionTicks(){
    const ticks = ticksEl.querySelectorAll('.tick');
    const radius = ticksEl.clientWidth / 2;
    ticks.forEach((t, i) => {
      const angle = i * 6;
      t.style.left = radius + 'px';
      t.style.top = '4px';
      t.style.transformOrigin = `1px ${radius - 4}px`;
      t.style.transform = `rotate(${angle}deg)`;
    });
  }
  window.addEventListener('resize', positionTicks);
  window.addEventListener('orientationchange', () => setTimeout(positionTicks, 60));

  // ---------- Audio (<audio> elements, no external files) ----------
  // Pre-rendered short WAV clips as base64 data URIs, played via HTML5
  // <audio>. Deliberately NOT the Web Audio API: oscillator-synthesized
  // tones proved unreliable on some real iOS Safari setups (context
  // reports "running" and playback is scheduled with no error, yet no

      toast.style.cssText = 'position:fixed; left:50%; top:max(12px, var(--safe-t)); transform:translateX(-50%); z-index:100; padding:9px 16px; border-radius:10px; font-size:12px; font-weight:700; max-width:88vw; text-align:center; pointer-events:none; border:1px solid var(--border); box-shadow:var(--shadow); transition:opacity .3s ease;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? 'var(--red)' : 'var(--panel-2)';
    toast.style.color = isError ? '#fff' : 'var(--text)';
    toast.style.opacity = '1';
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => { toast.style.opacity = '0'; }, 4000);
  }

  function initAudioElements(){
    if(audioStart) return;
    audioStart = new Audio(SOUND_START);
    audioTick = new Audio(SOUND_TICK);
    audioAlarm = new Audio(SOUND_ALARM);
    [audioStart, audioTick, audioAlarm].forEach(a => { a.preload = 'auto'; a.playsInline = true; });
  }

  // play() can — on some devices/OS audio-routing states — never resolve OR
  // reject, leaving an unguarded await stuck forever with no error and no
  // sound. Race it against a timeout so a hang becomes a visible diagnostic
  // instead of silent, permanent failure.
  function playWithTimeout(audioEl, ms){
    return Promise.race([
      audioEl.play(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('play() timed out — no response from the audio system')), ms))
    ]);
  }

  // Must run inside a real user-gesture call stack on iOS: play each clip
  // muted-and-immediately-paused once, then restore volume for later use.
  async function unlockAudioElements(){
    initAudioElements();
    if(audioUnlocked) return true;
    try{
      for(const a of [audioStart, audioTick, audioAlarm]){
        a.volume = 0;
        await playWithTimeout(a, 2500);
        a.pause();
        a.currentTime = 0;
        a.volume = 1;
      }
      audioUnlocked = true;
      return true;
    }catch(e){
      if(!audioDiagShown){
        audioDiagShown = true;
        showToast('Audio blocked: ' + (e && e.message ? e.message : e), true);
      }
      return false;
    }
  }

  function playClip(audioEl){
    if(!audioEl) return;
    try{
      audioEl.currentTime = 0;
      playWithTimeout(audioEl, 2500).catch(e => {
        if(!audioDiagShown){
          audioDiagShown = true;
          showToast('Playback blocked: ' + (e && e.message ? e.message : e), true);
        }
      });
    }catch(e){}
  }

  // Unlock on the very first tap anywhere, not just on the sound-producing
  // buttons, so playback is already unlocked by the time Start is pressed.
  ['touchend','mousedown','click'].forEach(evt => {
    document.addEventListener(evt, () => { unlockAudioElements(); }, { once: true, passive: true });
  });

  async function playStartSound(){
    if(!soundOn) return;
    await unlockAudioElements();
    playClip(audioStart);
  }

  async function playAdjustSound(){
    if(!soundOn) return;
    await unlockAudioElements();
    playClip(audioTick);
  }

  async function playEndAlarm(){
    if(!soundOn) return;
    await unlockAudioElements();
    playClip(audioAlarm);
  }

  // ---------- Formatting ----------
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;
    if(h > 0){
      return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ---------- Render ----------
  function render(){
    digitalEl.textContent = fmt(remaining);
    const pct = totalSeconds > 0 ? (remaining/totalSeconds*100) : 0;
    dialEl.style.setProperty('--pct', pct.toFixed(3));

    let color = 'var(--green)';
    digitalEl.classList.remove('warn','danger');
    if(pct <= 15 && remaining > 0){
      color = 'var(--red)';
      digitalEl.classList.add('danger');
    } else if(pct <= 40){
      color = 'var(--amber)';
      digitalEl.classList.add('warn');
    }
    if(remaining <= 0){
      color = 'var(--red)';
      digitalEl.classList.add('danger');
    }
    dialEl.style.setProperty('--wedge-color', color);

    if(remaining <= 0){
      subLabelEl.textContent = "Time's up";
    } else if(running){
      subLabelEl.textContent = 'Running';
    } else if(remaining === totalSeconds){
      subLabelEl.textContent = 'Ready';
    } else {
      subLabelEl.textContent = 'Paused';
    }

    document.title = (running ? `${fmt(remaining)} · ` : '') + 'Training Clock';

    if(pipActive) renderPipFrame();
  }

  // ---------- Floating timer (Picture-in-Picture) ----------
  // PiP windows are always an opaque rectangle — there's no way to make one
  // see-through to the desktop behind it — so this draws a clean, minimal
  // clock face instead of trying (and failing) to fake transparency.
  let pipActive = false;
  const pipCtx = pipCanvas.getContext('2d');
  const pipColors = {
    bg: '#12182a', track: '#28324a', text: '#eaf0ff', dim: '#8ea0c2',
    green: '#3ddc84', amber: '#ffb84d', red: '#ff5470'
  };

  function renderPipFrame(){
    const ctx = pipCtx;
    const W = pipCanvas.width, H = pipCanvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = pipColors.bg;
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2 + 6;
    const outerR = Math.min(W, H) * 0.42;
    const ringW = outerR * 0.16;
    const pct = totalSeconds > 0 ? Math.max(0, remaining / totalSeconds) : 0;

    let color = pipColors.green;
    if(remaining <= 0 || pct <= 0.15) color = pipColors.red;
    else if(pct <= 0.40) color = pipColors.amber;

    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = pipColors.track;
    ctx.lineWidth = ringW;
    ctx.stroke();

    if(pct > 0){
      const start = -Math.PI / 2;
      const end = start + pct * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, start, end);
      ctx.strokeStyle = color;
      ctx.lineWidth = ringW;
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = pipColors.text;
    ctx.font = '700 ' + Math.round(H * 0.155) + 'px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(fmt(remaining), cx, cy - H * 0.01);

    ctx.fillStyle = pipColors.dim;
    ctx.font = '700 ' + Math.round(H * 0.042) + 'px -apple-system, BlinkMacSystemFont, sans-serif';
    const label = remaining <= 0 ? "TIME'S UP" : (running ? 'RUNNING' : (remaining === totalSeconds ? 'READY' : 'PAUSED'));
    ctx.fillText(label, cx, cy + H * 0.12);
  }

  const pipSupported = !!(
    (document.pictureInPictureEnabled) ||
    (pipVideo && typeof pipVideo.webkitSupportsPresentationMode === 'function')
  );
  if(!pipSupported){
    pipBtn.classList.add('off');
    pipBtn.title = 'Floating timer — not supported in this browser';
  }

  function isPipCurrentlyActive(){
    return document.pictureInPictureElement === pipVideo ||
      pipVideo.webkitPresentationMode === 'picture-in-picture';
  }

  async function enterPip(){
    renderPipFrame();
    if(!pipVideo.srcObject){
      pipVideo.srcObject = pipCanvas.captureStream(15);
    }
    await pipVideo.play();
    if(pipVideo.requestPictureInPicture){
      await pipVideo.requestPictureInPicture();
    } else if(pipVideo.webkitSetPresentationMode){
      pipVideo.webkitSetPresentationMode('picture-in-picture');
    } else {
      throw new Error('Picture-in-Picture not available');
    }
  }

  async function exitPip(){
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    } else if(pipVideo.webkitSetPresentationMode){
      pipVideo.webkitSetPresentationMode('inline');
    }
  }

  function setPipUiActive(active){
    pipActive = active;
    pipBtn.classList.toggle('pip-active', active);
    pipBtn.title = active ? 'Floating timer is open (tap to close)' : 'Pop out floating timer';
    if(active) renderPipFrame();
  }

  pipBtn.addEventListener('click', async () => {
    if(!pipSupported){
      pipBtn.title = 'Floating timer — not supported in this browser';
      pipBtn.classList.add('off');
      setTimeout(() => pipBtn.classList.remove('off'), 150);
      setTimeout(() => pipBtn.classList.add('off'), 300);
      return;
    }
    try{
      if(isPipCurrentlyActive()){
        await exitPip();
      } else {
        await enterPip();
      }
    }catch(e){
      pipBtn.title = 'Could not open the floating timer';
    }
  });

  pipVideo.addEventListener('enterpictureinpicture', () => setPipUiActive(true));
  pipVideo.addEventListener('leavepictureinpicture', () => setPipUiActive(false));
  pipVideo.addEventListener('webkitpresentationmodechanged', () => {
    setPipUiActive(pipVideo.webkitPresentationMode === 'picture-in-picture');
  });

  // ---------- Timer engine ----------
  // setInterval, not requestAnimationFrame: rAF is throttled/paused in
  // backgrounded tabs, which would silently break both the countdown and
  // the end alarm exactly when the trainer switches to their slides app
  // (the scenario the floating PiP timer exists for). setInterval survives
  // backgrounding far more reliably, especially with an active PiP stream.
  function tick(){
    const now = performance.now();
    const elapsed = (now - lastTick) / 1000;
    lastTick = now;
    remaining -= elapsed;

    if(remaining <= 0){
      remaining = 0;
      render();
      finish();
      return;
    }
    render();
  }

  function finish(){
    running = false;
    startPauseBtn.textContent = '▶ Start';
    startPauseBtn.classList.remove('pause');
    clearInterval(tickHandle);
    playEndAlarm();
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 6000);
    releaseWakeLock();
  }

  function start(){
    if(remaining <= 0){
      remaining = totalSeconds;
    }
    if(running) return;
    running = true;
    document.body.classList.remove('flash');
    startPauseBtn.textContent = '⏸ Pause';
    startPauseBtn.classList.add('pause');
    playStartSound();
    requestWakeLock().then(ok => { if(ok) wakeBtn.classList.remove('off'); });
    lastTick = performance.now();
    clearInterval(tickHandle);
    tickHandle = setInterval(tick, 200);
  }

  function pause(){
    if(!running) return;
    running = false;
    startPauseBtn.textContent = '▶ Resume';
    startPauseBtn.classList.remove('pause');
    clearInterval(tickHandle);
    render();
  }

  function stop(){
    running = false;
    clearInterval(tickHandle);
    remaining = totalSeconds;
    document.body.classList.remove('flash');
    startPauseBtn.textContent = '▶ Start';
    startPauseBtn.classList.remove('pause');
    releaseWakeLock();
    render();
  }

  function resetToPreset(){
    running = false;
    clearInterval(tickHandle);
    remaining = totalSeconds;
    document.body.classList.remove('flash');
    startPauseBtn.textContent = '▶ Start';
    startPauseBtn.classList.remove('pause');
    render();
  }

  function adjust(deltaSec){
    remaining = Math.max(0, remaining + deltaSec);
    totalSeconds = Math.max(totalSeconds, remaining);
    playAdjustSound();
    if(remaining <= 0 && running){
      remaining = 0;
      render();
      finish();
    } else {
      render();
    }
  }

  function setDuration(sec){
    sec = Math.max(1, Math.min(sec, 6*3600));
    totalSeconds = sec;
    remaining = sec;
    running = false;
    clearInterval(tickHandle);
    document.body.classList.remove('flash');
    startPauseBtn.textContent = '▶ Start';
    startPauseBtn.classList.remove('pause');
    render();
  }

  // ---------- Wake Lock (keep screen on during training) ----------
  const wakeLockSupported = 'wakeLock' in navigator;
  if(!wakeLockSupported){
    wakeBtn.classList.add('off');
    wakeBtn.title = 'Keep screen awake — not supported in this browser';
  }

  async function requestWakeLock(){
    if(!wakeLockSupported) return false;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        wakeBtn.classList.add('off');
      });
      return true;
    }catch(e){
      wakeLock = null;
      return false;
    }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release().catch(()=>{});
      wakeLock = null;
    }
  }
  wakeBtn.addEventListener('click', async () => {
    if(!wakeLockSupported){
      wakeBtn.title = 'Keep screen awake — not supported in this browser (try Chrome/Edge on desktop or Android)';
      wakeBtn.classList.add('off');
      setTimeout(() => wakeBtn.classList.remove('off'), 150);
      setTimeout(() => wakeBtn.classList.add('off'), 300);
      return;
    }
    if(wakeLock){
      releaseWakeLock();
      wakeBtn.classList.add('off');
      wakeBtn.title = 'Keep screen awake (off)';
    } else {
      const ok = await requestWakeLock();
      if(ok){
        wakeBtn.classList.remove('off');
        wakeBtn.title = 'Keep screen awake (on)';
      } else {
        wakeBtn.classList.add('off');
        wakeBtn.title = 'Could not enable — screen may need to stay visible/focused for this to work';
        wakeBtn.textContent = '⚠';
        setTimeout(() => { wakeBtn.textContent = '☀'; }, 1500);
      }
    }
  });

  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState === 'visible' && wakeLock === null && !wakeBtn.classList.contains('off')){
      await requestWakeLock();
    }
  });

  // ---------- Events ----------
  presetsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.preset-btn');
    if(!btn) return;
    presetsEl.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const min = parseFloat(btn.dataset.min);
    customMin.value = min;
    customSec.value = 0;
    setDuration(min*60);
  });

  setCustomBtn.addEventListener('click', () => {
    presetsEl.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    const m = parseInt(customMin.value,10) || 0;
    const s = parseInt(customSec.value,10) || 0;
    setDuration(m*60 + s);
  });

  startPauseBtn.addEventListener('click', () => {
    if(running) pause(); else start();
  });
  resetBtn.addEventListener('click', resetToPreset);
  stopBtn.addEventListener('click', stop);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => adjust(parseInt(chip.dataset.adj,10)));
  });

  soundBtn.addEventListener('click', async () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !soundOn);
    if(soundOn){
      const ok = await unlockAudioElements();
      if(ok){
        playClip(audioStart);
        if(!audioDiagShown){ audioDiagShown = true; showToast('🔊 Audio ready', false); }
      }
    }
  });

  fsBtn.addEventListener('click', toggleFullscreenFocus);
  exitFocusBtn.addEventListener('click', toggleFullscreenFocus);

  function toggleFullscreenFocus(){
    const isFocus = document.body.classList.contains('fs-mode');
    if(!isFocus){
      document.documentElement.requestFullscreen?.().catch(()=>{});
      document.body.classList.add('fs-mode');
    } else {
      document.exitFullscreen?.().catch(()=>{});
      document.body.classList.remove('fs-mode');
    }
  }
  document.addEventListener('fullscreenchange', () => {
    if(!document.fullscreenElement){
      document.body.classList.remove('fs-mode');
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if(e.target === sessionTitle || e.target === customMin || e.target === customSec) return;
    switch(e.code){
      case 'Space':
        e.preventDefault();
        if(running) pause(); else start();
        break;
      case 'KeyR':
        resetToPreset();
        break;
      case 'KeyF':
        toggleFullscreenFocus();
        break;
      case 'KeyM':
        soundBtn.click();
        break;
      case 'KeyT':
        themeBtn.click();
        break;
      case 'KeyP':
        pipBtn.click();
        break;
    }
  });

  // Warn before closing tab while running
  window.addEventListener('beforeunload', (e) => {
    if(running){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Register service worker for offline / installable behavior
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Init
  setDuration(10*60);
  render();
})();
</script>
</body>
</html>
